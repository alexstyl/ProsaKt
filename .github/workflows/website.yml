name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/commonMain/**'
      - 'src/jsMain/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'package.yml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://prosakt.com

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Export browser library
        run: ./gradlew exportBrowserLibrary --no-configuration-cache
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Check website
        working-directory: website
        run: bun --bun run check
      - name: Test website
        working-directory: website
        run: bun run test
      - name: Build website
        working-directory: website
        run: bun --bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
